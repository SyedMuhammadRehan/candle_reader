name: candle_reader
description: >-
  An interactive candle reading-light widget for Flutter. Spring-follow flame,
  warm spotlight, pinch-to-resize, pinch-to-extinguish with rising smoke, and
  tap-to-relight. Works over any child — text, images, PageView, PDFs.
version: 0.1.0
repository: https://github.com/SyedMuhammadRehan/candle_reader
issue_tracker: https://github.com/SyedMuhammadRehan/candle_reader/issues

topics:
  - widget
  - animation
  - reading
  - candle
  - spotlight

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
